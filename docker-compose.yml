
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-car-sales-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_car_sales_crm
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: crm_password
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_app -d ai_car_sales_crm']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-car-sales-crm-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
